name: Daily Safe Upstream Sync
on:
  schedule:
    - cron: "40 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-safe-upstream-sync
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out this fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge original repository updates safely
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail

          metadata="$(curl --fail --silent --show-error --retry 3 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}")"

          parent="$(jq -r '.parent.full_name // empty' <<< "${metadata}")"
          parent_branch="$(jq -r '.parent.default_branch // empty' <<< "${metadata}")"

          if [[ -z "${parent}" || -z "${parent_branch}" ]]; then
            echo "No available upstream repository. Your fork has been left intact." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${parent}.git"
          git fetch --no-tags upstream "refs/heads/${parent_branch}:refs/remotes/upstream/auto-sync"

          if git merge-base --is-ancestor refs/remotes/upstream/auto-sync HEAD; then
            echo "Already current with ${parent} (${parent_branch})." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if ! git merge --no-edit --no-ff refs/remotes/upstream/auto-sync; then
            git merge --abort || true
            echo "Conflict merging ${parent} into ${TARGET_BRANCH}. No changes pushed; resolve manually." >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi

          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
          echo "Updated from ${parent} (${parent_branch}); existing fork commits preserved." >> "${GITHUB_STEP_SUMMARY}"
